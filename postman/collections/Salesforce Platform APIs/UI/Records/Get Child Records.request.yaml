$kind: http-request
description: Get child records for a specified record and child relationship name. Relationships are connections between records. On a record detail page, each record in a related list has a child relationship to the parent record.
url: |
  {{_endpoint}}/services/data/v{{version}}/ui-api/records/:RECORD_ID/child-relationships/:RELATIONSHIP_NAME
method: GET
queryParams:
  - key: fields
    value: ""
    disabled: true
    description: |-
      Specifies the fields to return. If this property is specified, the response is a union of fields and optionalFields.
      If the context user doesn’t have access to a field, an error is returned.

      If you’re not sure whether the context user has access to a field and you don’t want the request to fail if they don’t, use the optionalFields parameter.

      Specify names in the format ObjectApiName.FieldName. You can get any field that has a named relationship to this record. There is no limit to the number of fields you can specify.
  - key: optionalFields
    value: ""
    disabled: true
    description: |-
      A collection of optional field names. If a field is accessible to the context user, it’s included in the response. If a field isn’t accessible to the context user, it isn’t included in the response, but it doesn’t cause an error.
      Specify names in the format ObjectApiName.FieldName. You can get any field that has a named relationship to this record. There is no limit to the number of fields you can specify.
  - key: page
    value: ""
    disabled: true
    description: The page offset from which to begin returning records. The default value is 0, which returns records from the first page. For example, for page=2 and pageSize=10, the first record returned is the 21st record in the list.
  - key: pageSize
    value: ""
    disabled: true
    description: The maximum number of child records to return on a page. The default value is 5.
  - key: pageToken
    value: ""
    disabled: true
    description: A token that represents the page offset.
pathVariables:
  - key: RECORD_ID
    value: ""
    description: Record ID
  - key: |
      RELATIONSHIP_NAME
    value: ""
    description: API name of the relationship
settings: {}
examples: ./.resources/Get Child Records.resources/examples
order: 7000
