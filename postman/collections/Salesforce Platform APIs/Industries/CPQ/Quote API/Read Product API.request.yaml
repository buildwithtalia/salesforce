method: PATCH
headers:
  Content-Type: application/json
queryParams:
  loader: SBQQ.ProductAPI.ProductLoader
  uid: ""
body:
  type: json
  content: '{"context" : {"pricebookId": "01sA0000000wuhg", "currencyCode":"USD"}}'
settings: {}
