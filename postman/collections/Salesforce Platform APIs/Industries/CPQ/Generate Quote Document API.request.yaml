$kind: http-request
description: |-
  Creates and saves a CPQ quote document.
  Available in: Salesforce CPQ Winter ’19 and later

  https://developer.salesforce.com/docs/atlas.en-us.cpq_dev_api.meta/cpq_dev_api/cpq_api_generate_proposal.htm
url: "{{_endpoint}}/services/apexrest/SBQQ/ServiceRouter?loader=QuoteDocumentAPI.SaveProposal"
method: POST
headers:
  Content-Type: application/json
queryParams:
  loader: QuoteDocumentAPI.SaveProposal
body:
  type: json
  content: |-
    {
        "saver": "SBQQ.QuoteDocumentAPI.Save",
        "model": {
            "name": "test",
            "quoteId": "<SFDC_ID>",
            "templateId": "<SFDC_ID>",
            "outputFormat": "PDF",
            "language": "en_US",
            "paperSize": "Default"
        }
    }
settings: {}
order: 4000
