$kind: http-request
description: |-
  Standard Documentation:

  [https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_credit_points_to_members.htm](https://developer.salesforce.com/docs/atlas.en-us.loyalty.meta/loyalty/connect_resources_credit_points_to_members.htm)

  In the Pre-request. Script Tab, make changes in the variables value accordingly with the real Process Name to invoke.
url: "{{_endpoint}}/services/data/v{{version}}/connect/loyalty/programs/:loyaltyProgramName/program-processes/:processName"
method: POST
pathVariables:
  loyaltyProgramName: ""
  processName: ""
body:
  type: json
  content: |-
    {
       "processParameters":[
          {
             "TransactionJournal":{
                "ActivityDate":"2023-08-27T00:00:00Z",
                "ExternalTransactionNumber":"1",
                "InvoiceDate":"2023-08-23",
                "JournalTypeName":"Accrual",
                "MembershipNumber":"Member123",
                "TransactionAmount":"45.0",
                "CurrencyIsoCode":"EUR",
                "Status":"Processed"
             },
             "PointsToCredit":100.0
          }
       ]
    }
scripts:
  - type: beforeRequest
    code: |-
      //pm.variables.set('loyaltyProgramName','xyz');
      pm.variables.set('processName','CreditPointsToMembers');
    language: text/javascript
settings: {}
examples: ./.resources/Credit Points to Members.resources/examples
order: 2000
