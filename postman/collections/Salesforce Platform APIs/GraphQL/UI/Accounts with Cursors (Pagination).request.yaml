$kind: http-request
url: "{{_endpoint}}/services/data/v{{version}}/graphql"
method: POST
headers:
  X-Chatter-Entity-Encoding: "false"
body:
  type: graphql
  content:
    query: |-
      query accountsWithCursors($first: Int, $after: String) {
        uiapi {
          query {
            Account(first: $first, after: $after) {
              edges {
                node {
                  Id
                  Name {
                    value
                  }
                }
              }
              totalCount
              pageInfo {
                hasNextPage
                hasPreviousPage
                startCursor
                endCursor
              }
            }
          }
        }
      }
    variables: |-
      {
          "first": 3,
          "after": null
      }
settings: {}
examples: ./.resources/Accounts with Cursors (Pagination).resources/examples
order: 4000
