$kind: http-request
url: "{{_endpoint}}/services/data/v{{version}}/graphql"
method: POST
headers:
  X-Chatter-Entity-Encoding: "false"
body:
  type: graphql
  content:
    query: |-
      query accountsWithFilter($where: Account_Filter = {Name: {like: "s%"}}) {
        uiapi {
          query {
            Account(where: $where) {
              edges {
                node {
                  Id
                  Name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    variables: |-
      {
          "where": {
              "Name": {
                  "like": "%united%"
              }
          }
      }
settings: {}
examples: ./.resources/Accounts with Filter.resources/examples
order: 3000
