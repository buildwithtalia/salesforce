$kind: http-example
request:
  url: "{{_endpoint}}/services/data/v{{version}}/graphql"
  method: POST
  headers:
    X-Chatter-Entity-Encoding: "false"
  body:
    type: graphql
    content:
      query: |-
        query opportunitiesNotClosed {
          uiapi {
            query {
              Opportunity(
                where: {
                  not: {
                    or: [
                      { StageName: { eq: "Closed Won" } }
                      { StageName: { eq: "Closed Lost" } }
                    ]
                  }
                }
              ) {
                edges {
                  node {
                    Id
                    Name {
                      value
                    }
                    CloseDate {
                      value
                      displayValue
                    }
                    StageName {
                      value
                    }
                  }
                }
              }
            }
          }
        }
