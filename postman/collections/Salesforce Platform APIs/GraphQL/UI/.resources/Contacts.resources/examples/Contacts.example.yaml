request:
  url: "{{_endpoint}}/services/data/v{{version}}/graphql"
  method: POST
  headers:
    X-Chatter-Entity-Encoding: "false"
  body:
    type: graphql
    content:
      query: |-
        query contacts {
          uiapi {
            query {
              Contact {
                edges {
                  node {
                    Id
                    Name {
                      value
                    }
                  }
                }
              }
            }
          }
        }
