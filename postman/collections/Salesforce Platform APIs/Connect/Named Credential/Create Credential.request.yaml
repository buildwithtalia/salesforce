$kind: http-request
description: Create a credential.
url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential"
method: POST
body:
  type: json
  content: |-
    {
        "authenticationProtocol": "Custom",
        "credentials": {},
        "externalCredential": "SampleExternalCredential",
        "principalName": "SamplePrincipal",
        "principalType": "NamedPrincipal"
    }
settings: {}
examples: ./.resources/Create Credential.resources/examples
order: 6000
