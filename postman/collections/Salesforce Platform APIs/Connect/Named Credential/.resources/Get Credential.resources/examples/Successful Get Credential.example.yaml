$kind: http-example
request:
  url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential?externalCredential=Test&principalName=Test&principalType=NamedPrincipal"
  method: GET
  queryParams:
    - key: externalCredential
      value: Test
      description: Fully qualified developer name of the external credential.
    - key: principalName
      value: Test
      description: Name of the external credential named principal.
    - key: principalType
      value: NamedPrincipal
      description: |-
        Type of credential principal. Values are:
        * AwsStsPrincipal
        * NamedPrincipal
        * PerUserPrincipal
response:
  statusCode: 200
  statusText: OK
  headers:
    Date: Wed, 22 Nov 2023 12:01:04 GMT
    Strict-Transport-Security: max-age=63072000; includeSubDomains
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    X-Robots-Tag: none
    Cache-Control: no-cache,must-revalidate,max-age=0,no-store,private
    Content-Type: application/json;charset=UTF-8
    Vary: Accept-Encoding
    Content-Encoding: gzip
    Transfer-Encoding: chunked
  body:
    type: json
    content: |-
      {
          "authenticationProtocol": "Custom",
          "authenticationProtocolVariant": "NoAuthentication",
          "authenticationStatus": "Configured",
          "credentials": {},
          "externalCredential": "Test",
          "principalName": "Test",
          "principalType": "NamedPrincipal"
      }
order: 1000
