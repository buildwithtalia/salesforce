$kind: http-request
description: Update an external credential.
url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/external-credentials/:DEVELOPER_NAME"
method: PUT
pathVariables:
  DEVELOPER_NAME: ""
body:
  type: json
  content: |-
    {
       "masterLabel": "Sample External Credential",
       "authenticationProtocol": "Custom",
       "principals": [
          {
             "principalName": "SamplePrincipal",
             "principalType": "NamedPrincipal",
             "sequenceNumber": 1
          }
       ],
       "customHeaders": [
          {
             "headerName": "SampleHeader",
             "headerValue": "SampleHeaderValue",
             "sequenceNumber": 1
          }
       ]
    }
settings: {}
examples: ./.resources/Update External Credential.resources/examples
order: 10000
