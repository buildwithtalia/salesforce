$kind: http-request
description: Create an external credential.
url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/external-credentials"
method: POST
body:
  type: json
  content: |-
    {
       "developerName": "SampleExternalCredential",
       "masterLabel": "Sample External Credential",
       "authenticationProtocol": "Custom",
       "principals": [
          {
             "principalName": "SamplePrincipal",
             "principalType": "NamedPrincipal",
             "sequenceNumber": 1
          }
       ],
       "customHeaders": [
          {
             "headerName": "SampleHeader",
             "headerValue": "SampleHeaderValue",
             "sequenceNumber": 1
          }
       ]
    }
settings: {}
examples: ./.resources/Create External Credential.resources/examples
order: 7000
