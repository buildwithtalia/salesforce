$kind: http-request
description: Update a named credential.
url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/named-credential-setup/:DEVELOPER_NAME"
method: PUT
pathVariables:
  DEVELOPER_NAME: ""
body:
  type: json
  content: |-
    {
       "masterLabel": "SamplePrivateLabel",
       "type": "SecuredEndpoint",
       "calloutUrl": "https://api.example.com",
       "externalCredentials": [
          {
             "developerName": "SampleExternalCredential"
          }
       ],
       "customHeaders": [
          {
             "headerName": "SampleHeader",
             "headerValue": "SampleValue",
             "sequenceNumber": 1
          }
       ],
       "calloutOptions": {
          "allowMergeFieldsInBody": false,
          "allowMergeFieldsInHeader": true,
          "generateAuthorizationHeader": true
       }
    }
settings: {}
examples: ./.resources/Update Named Credential.resources/examples
order: 11000
