$kind: http-request
description: Update a credential.
url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential"
method: PUT
body:
  type: json
  content: |-
    {
        "externalCredential": "test",
        "authenticationProtocol": "Custom",
        "principalName": "test",
        "principalType": "NamedPrincipal",
        "credentials": {
            "testCredential": {
                "value": "000000",
                "encrypted": true
            }
        }
    }
settings: {}
order: 9000
