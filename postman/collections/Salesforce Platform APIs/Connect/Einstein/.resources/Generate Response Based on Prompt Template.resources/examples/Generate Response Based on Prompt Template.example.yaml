t;: &quot;Ler Ros&quot;,\n                        &quot;emoji&quot;: true\n                    },\n                    &quot;value&quot;: &quot;click_me_123&quot;,\n                    &quot;url&quot;: &quot;https://google.com&quot;\n                }\n            ]\n        }\n    ]\n}\n\nThe response should have the next format:\n{\n &quot;twitter&quot;: [here goes the twitter post, that should have less than 280 characters],\n &quot;linkedin&quot;: [here goes the linkedin post, that should have between 1500 and 2000 characters], \n &quot;blockkit&quot;: [here goes the block kit post], \n}\n\n&quot;&quot;&quot;\n\nNow generate the posts.\n\n\n",
