      // This is a scenario where there is a validation rule on the Gift Transaction object requiring the donor cover amount to be less than 10.00. One database error occurs for the 10.50 cover amount, causing the other two to be rolled back with success of false and no record links.
      {
          "successes": 0,
          "failures": 1,
          "notProcessed": 1,
          "details": [
              {
                  "success": false,
                  "errors": {
                      "message": "Donor cover amount must be less than 10.00"
                  }
              },
              {
                  "success": false
              }
          ]
      }
order: 3000
