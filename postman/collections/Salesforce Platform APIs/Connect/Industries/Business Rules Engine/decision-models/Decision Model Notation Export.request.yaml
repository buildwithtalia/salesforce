$kind: http-request
description: |-
  # Decision Model Notation Export (POST)

  Export decision matrix data to a file in the [DMN (Decision Model Notation)](https://www.omg.org/dmn/#:~:text=DMN%20is%20a%20modeling%20language,monitor%20their%20application;%20business%20analysts.) format, an easily readable format for business rules designed by Object Management Group.Resource

  ```
  /connect/business-rules/decision-models/export

   ```

  Resource Example

  ```
  https://yourInstance.salesforce.com/services/data/v59.0/connect/business-rules/decision-models/export

   ```

  Available version

  58.0

  Requires Chatter

  No

  HTTP methods

  POST

  Request body for POST

  JSON example

  ```
  {
     "decisionModelEntityIds":[
        “0lNRO00000004f72AA”,
        “0lNRO000000rfn27AA”
     ]
  }

   ```

  Properties

  | Name | Type | Description | Required or Optional | Available Version |
  | --- | --- | --- | --- | --- |
  | decisionModelEntityIds | String\[\] | A list of decision matrix version IDs to export data from. | Required | 58.0 |

  Response body for POST

  [Decision Model Export Output](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_decision_model_export_output.htm)

  # Decision Model Export Output

  Output representation of a completed DMN (Decision Model Notation) export request.JSON example

  ```
  {
     "message":"OK",
     "success":true,
     "errors":[
        {
           "errorCode":"BAD_REQUEST",
           "errorMessage":"We couldn’t find this record. Specify a valid ID for decisionModelEntityIds parameter.",
           "recordId":"0lNRO00000004fsdfAA"
        }
     ]
  }

   ```

  | Property Name | Type | Description | Filter Group and Version | Available Version |
  | --- | --- | --- | --- | --- |
  | errors | [Decision Model Export Error](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_decision_model_export_error.htm)\[\] | List of errors corresponding to a failed export request. | Small, 58.0 | 58.0 |
  | message | String | Response message from the completed export request. | Small, 58.0 | 58.0 |
  | success | Boolean | Indicates whether the export request was successful (true) or not (false). | Small, 58.0 | 58.0 |
url: "{{_endpoint}}/services/data/v{{version}}/connect/business-rules/decision-models/export"
