$kind: http-request
description: |-
  # Invoke Decision Tables

  Invoke a decision table by passing multiple input conditions within the same request.Resource

  ```
  /connect/business-rules/decision-table/lookup/${decisionTableId}

   ```

  Resource example

  ```
  https://yourInstance.salesforce.com/services/data/v59.0/connect
  /business-rules/decision-table/lookup/${0lDD2000000004NMAQ}

   ```

  Available version

  58.0

  Requires Chatter

  No

  HTTP methods

  POST

  Request body for POST

  JSON example

  ```
  {
     "datasetLinkName" : "transactionMapping",
     “conditions” :[
        {
          “conditionsList”: [
            {
                "fieldName": "Product__c",
                "value": "Nike",
                "operator": "Matches" //Operator is optional
            },
            {
                "fieldName": "Price__c",
                "value": 1000,
                "operator": "GreaterThan"
            }
          ]
        },
        {
          “conditionsList”: [
            {
                "fieldName": "Product__c",
                "value": "Adidas",
                "operator": "Matches" //Operator is optional
            },
            {
                "fieldName": "Price__c",
                "value": 1500,
                "operator": "GreaterThan"
            }
          ]

   ```

  Properties

  | Name | Type | Description | Required or Optional | Available Version |
  | --- | --- | --- | --- | --- |
  | conditions | [Decision Table Condition List](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_requests_decision_table_condition_list_input.htm) | The list of decision table conditions on which the decision table executes and provides outcomes. | Required | 58.0 |
  | datasetLinkName | String | The API name of the dataset link provided as an input for the decision table execution. | Optional | 58.0 |

  Response body for POST

  [Decision Table Bulk Outcome](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_decision_table_bulk_outcome.htm)

  # Decision Table Bulk Outcome

  Output representation of the decision table bulk look-up.

  | Property Name | Type | Description | Filter Group and Version | Available Version |
  | --- | --- | --- | --- | --- |
  | outputs | [Decision Table Outcome](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_decision_table_outcome.htm) | List of the output of the Decision Table bulk lookup. | Small, 58.0 | 58.0 |
url: "{{_endpoint}}/services/data/v{{version}}/connect/business-rules/decision-table/lookup/:decisionTableId"
method: POST
pathVariables:
  - key: decisionTableId
    value: 0lDHo0000008Po3
    description: Decision Table Id
body:
  type: json
  content: |-
    {
        "datasetLinkName": "transactionMapping",
        "conditions": [
            {
                "conditionsList": [
                    {
                        "fieldName": "Product__c",
                        "value": "Nike",
                        "operator": "Matches" //Operator is optional
                    },
                    {
                        "fieldName": "Price__c",
                        "value": 1000,
                        "operator": "GreaterThan"
                    }
                ]
            },
            {
                "conditionsList": [
                    {
                        "fieldName": "Product__c",
                        "value": "Adidas",
                        "operator": "Matches" //Operator is optional
                    },
                    {
                        "fieldName": "Price__c",
                        "value": 1500,
                        "operator": "GreaterThan"
                    }
                ]
            }
        ]
    }
settings: {}
examples: ./.resources/Invoke.resources/examples
order: 1000
