$kind: http-request
description: |-
  # Decision Table (Lookup Table)

  Performs a lookup on a decision table.Resource

  ```
  /connect/business-rules/decision-table/${decisionTableId}

   ```

  Resource Example

  ```
  https://yourInstance.salesforce.com/services/data/v55.0/connect
  /decision-table/0lDB0000000TNQzMAO

   ```

  Available version

  55.0

  Requires Chatter

  No

  HTTP methods

  POST

  Request body for POST

  JSON example

  ```
  {
     "conditions" : {
        "conditionsList" : [
           {
              "fieldName": "state__c",
              "value": "MH"
           },
           {
              "fieldName": "validity__c",
              "value": 30
           }
        ]
     }
  }

   ```

  Properties

  | Name | Type | Description | Required or Optional | Available Version |
  | --- | --- | --- | --- | --- |
  | conditions | [Decision Table Condition](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_requests_decision_table_condition.htm)\[\] | The list of decision table conditions on which the decision table executes and provides outcomes. | Required | 55.0 |
  | datasetLinkName | String | The API name of the dataset link provided as an input for the decision table execution. | Optional | 55.0 |

  Response body for POST

  [Decision Table Outcome](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_decision_table_outcome.htm)

  # Decision Table Outcome

  Output representation of the decision table execution.JSON example

  ```
  {
    "errorCode" : null,
    "errorMessage" : null,
    "outcomeList" : [ {
      "values" : {
        "amount__c" : "399",
        "Name" : "MH 005"
      }
    }, {
      "values" : {
        "amount__c" : "499",
        "Name" : "MH 006"
      }
    }, {
      "values" : {
        "amount__c" : "379",
        "Name" : "MH 007"
      }
    }, {
      "values" : {
        "amount__c" : "1498",
        "Name" : "MH 008"
      }
    }, {
      "values" : {
        "amount__c" : "98",
        "Name" : "MH 009"
      }
    }, {
      "values" : {
        "amount__c" : "251",
        "Name" : "MH 010"
      }
    } ],
    "outcomeType" : "Multiple Matches",
    "successStatus" : true
  }

   ```

  | Property Name | Type | Description | Filter Group and Version | Available Version |
  | --- | --- | --- | --- | --- |
  | errorCode | Integer | The error code if transaction fails for any reason. | Small, 55.0 | 55.0 |
  | errorMessage | String | The error message if transaction fails for any reason. | Small, 55.0 | 55.0 |
  | outcomeList | [Decision Table Outcome Item](https://developer.salesforce.com/docs/atlas.en-us.industries_reference.meta/industries_reference/connect_responses_decision_table_outcome_item.htm)\[\] | Outcome list that stores two or more outcomes provided by the decision table. | Small, 55.0 | 55.0 |
  | outcomeType | String | The outcome type after the request is successful. | Small, 55.0 | 55.0 |
  | successStatus | Boolean | Indicates the status of the decision table execution. | Small, 55.0 | 55.0 |
url: "{{_endpoint}}/services/data/v{{version}}/connect/business-rules/decision-table/:decisionTableId"
method: POST
pathVariables:
  - key: decisionTableId
    value: 0lDHo0000008Pnt
    description: Decision Table Id
body:
  type: json
  content: |-
    {
        "conditions": {
            "conditionsList": [
                {
                    "fieldName": "IsDeleted",
                    "value": true
                }
            ]
        }
    }
settings: {}
examples: ./.resources/Lookup Table.resources/examples
order: 6000
