$kind: http-example
request:
  url: "{{_endpoint}}/services/data/v{{version}}/connect/business-rules/decision-matrices/:matrixUniqueName"
  method: POST
  pathVariables:
    - key: matrixUniqueName
      value: blah
      description: Matrix Unique Name
