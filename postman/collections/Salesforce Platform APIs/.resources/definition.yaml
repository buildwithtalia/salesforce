  ### Regular Postman Users

  If you are already familiar with Postman, here are the minimal getting started steps:

  1. If using Postman Web UI, follow these [steps to set up CORS](https://github.com/forcedotcom/postman-salesforce-apis/blob/master/install-with-web.md#enable-cors-in-salesforce) in your Salesforce Org. This is not required when working with the Postman Desktop app.

  2. Assign a value to the `url` collection variable based on your Salesforce Org type:
      
      | URL | Org Type |
      | --- | --- |
      | `https://test.salesforce.com` | Sandboxes or Scratch orgs. |
      | `https://login.salesforce.com` | Production, Trailhead Playground and Developer Edition orgs. |
      | Custom My Domain base URL | Org with a custom domain. |
      
  3. Click **Get New Access Token** from the collection's **Authorization** tab.
      
  4. When prompted to do so, log in to your Salesforce org and allow access to "Salesforce APIs Collection for Postman".
      
  5. Copy the value of the `instance_url` field from the token details view.
      
  6. Click **Use Token**.
      
  7. Save the value that you copied in the `_endpoint` variable.
      
  8. Click **Save** and you're good to go!
      

