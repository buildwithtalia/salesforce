scripts:
  - type: http:beforeRequest
    code: |
      // Specifying Postman as the client for Salesforce logs 
      pm.request.headers.add({key: 'Sforce-Call-Options', value: 'client=postman' });
    language: text/javascript
auth:
  - id: 11f63a81-e2f1-4bee-8372-dd096322f8b0
    type: oauth2
    name: oauth2 auth
    credentials:
      clientId: "{{salesforce_consumer_key_0bm0}}"
      accessTokenUrl: https://login.salesforce.com/services/oauth2/token
      authUrl: https://login.salesforce.com/services/oauth2/authorize
      tokenName: access_token
      addTokenTo: header
      challengeAlgorithm: S256
      clientSecret: "{{auth_secret_12ya}}"
      scope: api
      client_authentication: body
      grant_type: authorization_code
      useBrowser: true
      username: "{{username}}"
      password: "{{password}}"
