$kind: collection
name: Salesforce Platform APIs
description: |-
  The Salesforce Platform APIs collection contains 250+ requests and example responses for the following APIs:

  <table><tbody><tr><td><div>Auth<br>Bulk (v1 &amp; v2)<br>Composite<br>Connect<br>CPQ<br>Einstein Prediction Service<br>Event Platform</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td><td><div>GraphQL<br>Loyalty Management<br>Metadata<br>REST<br>Subscription Management<br>Tooling<br>UI</div><div contenteditable="false"><div><div><div></div></div></div><div></div></div></td></tr></tbody></table>

  **⚠️ Disclaimer:** this collection is not covered by Salesforce support and SLAs.

