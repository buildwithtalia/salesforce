$kind: http-request
url: "{{_endpoint}}/services/data/v{{version}}/tooling/sobjects/NamedCredential"
method: POST
body:
  type: json
  content: |-
    {
        "FullName": "MyNamedCredential",
        "Metadata": {
            "label": "My Named Credential",
            "endpoint": "arn:aws:AWS_REGION:AWS_ACCOUNT_ID",
            "principalType": "Anonymous",
            "protocol": "NoAuthentication"
        }
    }
settings:
  strictSSL: false
order: 3000
