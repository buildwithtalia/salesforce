$kind: http-request
url: "{{_endpoint}}/services/data/v{{version}}/tooling/sobjects/NamedCredential/:NAMED_CREDENTIAL_ID"
method: PATCH
pathVariables:
  NAMED_CREDENTIAL_ID: ""
body:
  type: json
  content: |-
    {
        "FullName": "MyNamedCredential",
        "Metadata": {
            "label": "My Named Credential",
            "endpoint" : "arn:aws:AWS_REGION:AWS_ACCOUNT_ID",
            "principalType" : "Anonymous",
            "protocol": "NoAuthentication" 
        }
    }
settings: {}
order: 5000
