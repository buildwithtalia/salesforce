$kind: http-example
request:
  url: "{{_endpoint}}/services/async/{{version}}/job/{{_jobId}}/spec"
  method: POST
  headers:
    X-SFDC-Session: "{{_accessToken}}"
    Content-Type: text/csv
    charset: UTF-8
    Accept-Encoding: gzip
    Content-Encoding: gzip
  body:
    type: text
    content: |-
      Salesforce Field,Csv Header,Value,Hint
      Name,Full Name,,
response:
  statusCode: 201
  statusText: Created
  headers:
    Date: Thu, 16 Nov 2023 16:12:34 GMT
    Strict-Transport-Security: max-age=63072000; includeSubDomains
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    Content-Security-Policy: upgrade-insecure-requests
    X-Robots-Tag: none
    Cache-Control: no-cache,must-revalidate,max-age=0,no-store,private
    Location: /services/async/58.0/job/7502o00000kjNCsAAM/spec/0Aj2o000000PbakCAC
    Vary: Accept-Encoding
    Content-Encoding: gzip
    Transfer-Encoding: chunked
  body:
    type: text
    content: ""
order: 1000
