$kind: http-example
request:
  url: "{{_endpoint}}/services/data/v{{version}}/actions/custom/runDecisionMatrix/:UniqueName"
  method: POST
  headers:
    Content-Type: application/json
  pathVariables:
    - key: UniqueName
      value: myDecisionMatrix
      description: The value of UniqueName is the unique identifier of the record, which is sourced from the name of a decision matrix.
  body:
    type: text
    content: |
      {
         "inputs":[
            {
               "myColumnInput":"One"
            }
         ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Date: Thu, 07 Sep 2023 13:00:30 GMT
    Strict-Transport-Security: max-age=63072000; includeSubDomains
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    X-Robots-Tag: none
    Cache-Control: no-cache,must-revalidate,max-age=0,no-store,private
    Sforce-Limit-Info: api-usage=15/15000
    Content-Type: application/json;charset=UTF-8
    Vary: Accept-Encoding
    Content-Encoding: gzip
    Transfer-Encoding: chunked
  body:
    type: json
    content: |-
      [
          {
              "actionName": "myDecisionMatrix",
              "errors": null,
              "isSuccess": true,
              "outputValues": {
                  "myColumnOutput": "1"
              },
              "version": 1
          }
      ]
order: 1000
