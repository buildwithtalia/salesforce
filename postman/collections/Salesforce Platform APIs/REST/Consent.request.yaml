$kind: http-request
description: |-
  Your users can store consent preferences in different locations and possibly inconsistently. You can locate your customers’ preferences for consent across multiple records when using API version 44.0 and later. Tracking consent preferences helps you and your users respect the most restrictive requests.
  Consent API aggregates consent settings across the Contact, Contact Point Type Consent, Data Use Purpose, Individual, Lead, Person Account, and User objects when the records have a lookup relationship. The Consent API can't locate records in which the email address field is protected by Platform Encryption.

  The API returns consent details based on a single action, like email or track, or—starting with API version 45.0—the multiaction endpoint allows you to request multiple actions in a single API call.
url: "{{_endpoint}}/services/data/v{{version}}/consent/action/action?actions=&ids="
method: GET
headers:
  Content-Type: application/json
queryParams:
  - key: aggregatedConsent
    value: ""
    disabled: true
    description: "Optional: true or false. aggregatedConsent is the same as aggregatedConsent=true. If true, one result is returned indicating whether to proceed or not, rather than a result for each ID. If any ID in the list returns false, the aggregated result is false."
  - key: datetime
    value: ""
    disabled: true
    description: Optional. The timestamp for which consent is determined. The value is converted to the UTC timezone and must be specified in ISO 8601 format. If not specified, defaults to the current date and time.
  - key: purpose
    value: ""
    disabled: true
    description: Optional. The reason for contacting a customer.
  - key: verbose
    value: ""
    disabled: true
    description: "Optional: true or false. verbose is the same as verbose=true. Verbose responses are slower than non-verbose responses. See the examples for a verbose response."
  - key: actions
    value: ""
  - key: ids
    value: ""
settings: {}
order: 16000
