$kind: http-request
url: "{{url}}{{site}}/services/oauth2/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    grant_type: password
    client_id: "{{clientId}}"
    client_secret: "{{clientSecret}}"
    username: "{{username}}"
    password: "{{password}}{{secretToken}}"
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();

      if (pm.response.code === 200 && jsonData.id) {
          const id = jsonData.id.split('/');
          const context = pm.environment.name ? pm.environment : pm.collectionVariables;
          context.set("_accessToken", jsonData.access_token);
          context.set("_endpoint", jsonData.instance_url);
          context.set("_userId", id.pop());
          context.set("_orgId", id.pop());
      } else {
          console.error("OAuth token request failed:", jsonData.error, jsonData.error_description);
      }
    language: text/javascript
settings: {}
examples: ./.resources/Username Password Flow.resources/examples
order: 4000
