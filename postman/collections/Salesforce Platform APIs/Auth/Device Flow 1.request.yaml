$kind: http-request
url: "{{url}}{{site}}/services/oauth2/token"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: response_type
      value: device_code
    - type: text
      key: client_id
      value: "{{clientId}}"
    - type: text
      key: format
      value: json
    - type: text
      key: scope
      value: full refresh_token
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      const jsonData = pm.response.json();
      const context = pm.environment.name ? pm.environment : pm.collectionVariables;
      context.set("_deviceCode", jsonData.device_code);
    language: text/javascript
settings: {}
examples: ./.resources/Device Flow 1.resources/examples
order: 10000
