$kind: http-request
url: "{{url}}{{site}}/services/oauth2/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    grant_type: client_credentials
    client_id: "{{clientId}}"
    client_secret: "{{clientSecret}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();

      if(!jsonData.error){
          const id = jsonData.id.split('/');
          const context = pm.environment.name ? pm.environment : pm.collectionVariables;
          context.set("_accessToken", jsonData.access_token);
          context.set("_endpoint", jsonData.instance_url);
          context.set("_userId", id.pop());
          context.set("_orgId", id.pop());
      }
    language: text/javascript
settings:
  disableCookies: true
examples: ./.resources/Client Credentials Flow.resources/examples
order: 8000
