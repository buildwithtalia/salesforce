$kind: http-example
request:
  url: "{{url}}{{site}}/services/oauth2/token"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Authorization
      value: Basic {{clientCredential_basicAuthEncoded}}
      description: Base64 encoded basic credentials (see pre-request script)
  body:
    type: urlencoded
    content:
      - key: grant_type
        value: client_credentials
      - key: client_id
        value: "{{clientId}}"
        disabled: true
      - key: client_secret
        value: "{{clientSecret}}"
        disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Date
      value: Thu, 16 Nov 2023 15:29:08 GMT
    - key: Set-Cookie
      value: CookieConsentPolicy=0:1; path=/; expires=Fri, 15-Nov-2024 15:29:08 GMT; Max-Age=31536000
    - key: Set-Cookie
      value: LSKey-c$CookieConsentPolicy=0:1; path=/; expires=Fri, 15-Nov-2024 15:29:08 GMT; Max-Age=31536000
    - key: Set-Cookie
      value: BrowserId=4pAG8YSUEe6FQrcdNvkArw; domain=.salesforce.com; path=/; expires=Fri, 15-Nov-2024 15:29:08 GMT; Max-Age=31536000
    - key: Strict-Transport-Security
      value: max-age=63072000; includeSubDomains
    - key: X-Content-Type-Options
      value: nosniff
    - key: X-XSS-Protection
      value: 1; mode=block
    - key: X-Robots-Tag
      value: none
    - key: Cache-Control
      value: no-cache,must-revalidate,max-age=0,no-store,private
    - key: Expires
      value: Thu, 01 Jan 1970 00:00:00 GMT
    - key: Content-Type
      value: application/json;charset=UTF-8
    - key: Vary
      value: Accept-Encoding
    - key: Content-Encoding
      value: gzip
    - key: Transfer-Encoding
      value: chunked
  body:
    type: json
    content: |-
      {
          "access_token": "<access_token>",
          "signature": "<signature>",
          "scope": "<scope list>",
          "instance_url": "https://<my_domain>",
          "id": "https://login.salesforce.com/id/00D.../005...",
          "token_type": "Bearer",
          "issued_at": "<timestamp>",
          "api_instance_url": "https://api.salesforce.com"
      }
order: 1000
