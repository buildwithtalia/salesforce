$kind: http-example
request:
  url: "{{url}}{{site}}/services/oauth2/authorize?response_type=token&client_id={{clientId}}&redirect_uri={{redirectUrl}}&display=touch&login_hint&nonce=awesome"
  method: GET
  queryParams:
    response_type: token
    client_id: "{{clientId}}"
    redirect_uri: "{{redirectUrl}}"
    display: touch
    login_hint: null
    nonce: awesome
response:
  statusCode: 200
  statusText: OK
  headers:
    Strict-Transport-Security: max-age=63072000; includeSubDomains
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    Content-Security-Policy: upgrade-insecure-requests
    X-Robots-Tag: none
    Cache-Control: must-revalidate,no-cache,no-store
    Content-Type: text/html; charset=UTF-8
    Vary: Accept-Encoding
    Content-Encoding: gzip
    Connection: close
  body:
    type: html
    content: |
      


      <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
      <html>
          <head>
              <meta HTTP-EQUIV="PRAGMA" CONTENT="NO-CACHE">
              <script>
      function redirectOnLoad() {
      if (this.SfdcApp && this.SfdcApp.projectOneNavigator) { SfdcApp.projectOneNavigator.handleRedirect('<my-domain>?ec=302&startURL=%2Fsetup%2Fsecur%2FRemoteAccessAuthorizationPage.apexp%3Fsource%3D<token>%26display%3Dtouch&display=touch'); }  else 
      if (window.location.replace){ 
      window.location.replace('<my-domain>>?ec=302&startURL=%2Fsetup%2Fsecur%2FRemoteAccessAuthorizationPage.apexp%3Fsource%3D<token>%26display%3Dtouch&display=touch');
      } else {
      window.location.href ='<my-domain>>?ec=302&startURL=%2Fsetup%2Fsecur%2FRemoteAccessAuthorizationPage.apexp%3Fsource%3D<token>%26display%3Dtouch&display=touch';
      } 
      } 
      redirectOnLoad();
      </script>
          </head>
      </html>
      <!-- Body events -->
      <script type="text/javascript">function bodyOnLoad(){if(window.PreferenceBits){window.PreferenceBits.prototype.csrfToken="null";};}function bodyOnBeforeUnload(){}function bodyOnFocus(){}function bodyOnUnload(){}</script>
      </body>
      </html>
      <!--
      ...................................................................................................
      ...................................................................................................
      ...................................................................................................
      ...................................................................................................
      -->
order: 1000
