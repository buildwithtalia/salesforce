$kind: collection
description: "> External client apps is a packageable framework to integrate a third-party application with Salesforce using APIs and security protocols. External client apps provide single sign-on (SSO) and use OAuth protocols to authorize third-party apps. The third-party apps that are integrated with Salesforce can run on the customer success platform as well as other platforms, devices, or SaaS subscriptions. Use the credentials endpoints in this collection to get OAuth credentials for a single consumer or all consumers associated with an external client app. The OAuth usage endpoints return information about the external client apps in your org, users for an app, and tokens. OAuth usage also includes Revoke endpoints that you can use to revoke one token, all tokens by app, or all tokens by user. [External Client Apps](https://help.salesforce.com/s/articleView?id=sf.external_client_apps.htm&type=5)"
order: 2000
