$kind: http-request
url: "{{url}}{{site}}/services/oauth2/token"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: grant_type
      value: device
    - type: text
      key: client_id
      value: "{{clientId}}"
    - type: text
      key: format
      value: json
    - type: text
      key: code
      value: "{{_deviceCode}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      const jsonData = pm.response.json();
      const context = pm.environment.name ? pm.environment : pm.collectionVariables;
      context.set("_refreshToken", jsonData.refresh_token);
    language: text/javascript
settings: {}
examples: ./.resources/Device Flow 2.resources/examples
order: 11000
