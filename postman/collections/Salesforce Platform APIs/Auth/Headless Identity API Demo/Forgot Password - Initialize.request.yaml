$kind: http-request
url: "{{url}}{{site}}/services/auth/headless/forgot_password"
method: POST
body:
  type: json
  content: |-
    {
        "username": "<username>",
        "recaptcha": "<recaptcha token>"
    }
auth:
  type: noauth
settings:
  disabledSystemHeaders:
    - accept
    - accept-encoding
    - connection
    - user-agent
order: 6000
