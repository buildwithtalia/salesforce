$kind: http-request
description: |-
  This request allows named users to use their username and password to get an access token and refresh token from Salesforce in a headless manner. There are two headers that must be included, the first is the `Auth-Request-Type` which must be set to `Named-User`, and then there is the `Authorization` Basic header which contains the base 64 encoded username:password of the user.

  The result of this API call, is an Auth Code, which is then exchanged with another call at the token endpoint.
url: "{{url}}{{site}}/services/oauth2/authorize"
method: POST
headers:
  - key: Auth-Request-Type
    value: Named-User
    description: Required for Username Password Login
  - key: Authorization
    value: Basic <username:password>
    description: Base 64 encoded username:password
body:
  type: urlencoded
  content:
    - key: response_type
      value: code_credentials
    - key: client_id
      value: "{{clientId}}"
    - key: redirect_uri
      value: "{{redirectUrl}}"
    - key: scope
      value: ""
      disabled: true
      description: Comma seperated list of scopes, optional
auth:
  type: noauth
settings: {}
order: 4000
