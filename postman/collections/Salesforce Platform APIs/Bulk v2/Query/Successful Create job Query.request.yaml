$kind: http-request
url: "{{_endpoint}}/services/data/v{{version}}/jobs/query"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "operation" : "query",
      "query" : "SELECT fields FROM object WHERE filter",
      "contentType" : "CSV",
      "columnDelimiter" : "BACKQUOTE | CARET | COMMA | PIPE | SEMICOLON | TAB",
      "lineEnding" : "CRLF | LF"
    } 
scripts:
  - type: afterResponse
    code: |-
      const context = pm.environment.name ? pm.environment : pm.collectionVariables;

      const response = JSON.parse(pm.response.text())
      context.set("_jobId", response.id);
    language: text/javascript
settings: {}
examples: ./.resources/Successful Create job Query.resources/examples
order: 1000
