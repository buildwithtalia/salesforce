$kind: http-request
description: Get available prediction definitions.
url: "{{_endpoint}}/services/data/v{{version}}/smartdatadiscovery/predict"
method: POST
body:
  type: json
  content: |-
    {
        "predictionDefinition": "<PREDICTION_DEFINITION_ID>",
        "type": "RawData",
        "columnNames": [
            "Quantity",
            "Category",
            "Sub_Category",
            "Sales",
            "Profit_per_Order"
        ],
        "rows": [
            [
                "2",
                "Furniture",
                "Chairs",
                "300",
                "10"
            ]
        ]
    }
settings: {}
examples: ./.resources/Predict.resources/examples
order: 1000
