$kind: http-request
description: |-
  `type`: Replace the value of `type` with the metadata type you're interested in

  `folder`: If your type requires a folder add it here. Null values are ignored

  e.g. 

  ```<type>CustomObject</type>
  <folder></folder>```

  or

  ```<type>Dashboard</type>
  <folder>Service_Dashboards</folder>```
url: "{{_endpoint}}/services/Soap/m/{{version}}"
method: POST
headers:
  Content-Type: text/xml
  charset: UTF-8
  SOAPAction: login
  Accept: text/xml
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="utf-8"?>
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:tns="http://soap.sforce.com/2006/04/metadata">
        <soapenv:Header>
            <tns:SessionHeader>
                <tns:sessionId>{{_accessToken}}</tns:sessionId>
            </tns:SessionHeader>
        </soapenv:Header>
        <soapenv:Body>
            <tns:listMetadata>
                <listMetadataQuery>
                    <type>CustomObject</type>
                    <folder></folder>
                </listMetadataQuery>
                <asOfVersion>{{version}}</asOfVersion>
            </tns:listMetadata>
        </soapenv:Body>
    </soapenv:Envelope>
auth:
  type: noauth
settings: {}
examples: ./.resources/SOAP List Metadata.resources/examples
order: 3000
