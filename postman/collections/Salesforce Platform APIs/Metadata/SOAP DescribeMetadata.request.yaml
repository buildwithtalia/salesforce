$kind: http-request
url: "{{_endpoint}}/services/Soap/m/{{version}}"
method: POST
headers:
  Content-Type: text/xml
  charset: UTF-8
  SOAPAction: login
  Accept: text/xml
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="utf-8"?>
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:tns="http://soap.sforce.com/2006/04/metadata">
    	<soapenv:Header>
    	<tns:SessionHeader>
    		<tns:sessionId>{{_accessToken}}</tns:sessionId>
    	</tns:SessionHeader>
    	</soapenv:Header>
    	<soapenv:Body>
    		<tns:describeMetadata>
    			<asOfVersion>{{version}}</asOfVersion>
    		</tns:describeMetadata>
    	</soapenv:Body>
    </soapenv:Envelope>
auth:
  type: noauth
settings: {}
examples: ./.resources/SOAP DescribeMetadata.resources/examples
order: 1000
